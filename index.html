<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP PREDICTOR SCRIPT</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Share Tech Mono', 'Tajawal', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        .screen {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.5s ease-in-out;
        }

        .login-box {
            position: relative;
            background: rgba(10, 10, 15, 0.8);
            padding: 40px 30px;
            border-radius: 15px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .login-box::before, .login-box::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #00ffcc);
            animation: rotateGlow 4s linear infinite;
            z-index: -2;
        }
        .login-box::after {
            background: conic-gradient(transparent, transparent, transparent, #ff00ff);
            animation: rotateGlow 4s linear infinite -2s;
        }
        .login-box-inner {
            position: absolute;
            inset: 3px;
            background: #0d0d12;
            border-radius: 12px;
            z-index: -1;
        }

        .title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px #00ffcc;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid #00ffcc;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            background: rgba(0, 255, 204, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            font-family: 'Tajawal', sans-serif;
        }

        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }

        .terminal {
            width: 100%;
            height: 200px;
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            color: #0f0;
            font-size: 14px;
            text-align: left;
            overflow: hidden;
            border-radius: 8px;
            direction: ltr;
        }

        .radar-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .radar-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #00ffcc;
            border-bottom-color: #ff00ff;
            animation: spin 2s linear infinite;
        }

        .ring1 { width: 100%; height: 100%; animation-duration: 3s; }
        .ring2 { width: 85%; height: 85%; border-top-color: #ff00ff; border-bottom-color: #00ffcc; animation-duration: 2s; animation-direction: reverse; }
        .ring3 { width: 70%; height: 70%; border-top-color: #fff; border-bottom-color: transparent; animation-duration: 1.5s; border-style: dashed; }

        .multiplier-display {
            font-size: 45px;
            color: #fff;
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            font-weight: bold;
            z-index: 5;
        }

        .status-box {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 12px;
            letter-spacing: 2px;
        }
        .connection-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #f00;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 8px #f00;
        }
        .connected .connection-dot {
            background: #0f0;
            box-shadow: 0 0 8px #0f0;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="top-bar" id="status-indicator">
        <span class="connection-dot"></span> STATUS: OFFLINE
    </div>

    <div class="screen active" id="screen-login">
        <div class="login-box">
            <div class="login-box-inner"></div>
            <h2 class="title">SYSTEM LOGIN</h2>
            <div class="input-group">
                <input type="text" id="userId" placeholder="Enter User ID..." autocomplete="off">
            </div>
            <button onclick="connectToServer()">اتصال بالسيرفر</button>
        </div>
    </div>

    <div class="screen" id="screen-loading">
        <h2 style="color: #00ffcc; margin-bottom: 15px;">CONNECTING...</h2>
        <div class="terminal" id="terminal"></div>
    </div>

    <div class="screen" id="screen-main">
        <h2 style="color: #fff; margin-bottom: 20px; letter-spacing: 3px; font-family: 'Share Tech Mono', monospace;">AVIATOR PREDICTOR</h2>
        
        <div class="radar-container">
            <div class="radar-ring ring1"></div>
            <div class="radar-ring ring2"></div>
            <div class="radar-ring ring3"></div>
            
            <div class="multiplier-display" id="prediction-value">WAIT</div>
        </div>

        <div class="status-box" id="game-status">
            جاري انتظار اللعبة...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAdioWu9Luc-5db2jR6g1Xx-AZYRZPblQ",
            databaseURL: "https://gghh-cf9dd-default-rtdb.firebaseio.com",
            projectId: "gghh-cf9dd",
            storageBucket: "gghh-cf9dd.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const screenLogin = document.getElementById('screen-login');
        const screenLoading = document.getElementById('screen-loading');
        const screenMain = document.getElementById('screen-main');
        const terminal = document.getElementById('terminal');
        const statusIndicator = document.getElementById('status-indicator');
        
        const predictionValue = document.getElementById('prediction-value');
        const gameStatus = document.getElementById('game-status');

        let isDecrypting = false;
        let lastTimestamp = null;

        window.connectToServer = function() {
            const inputVal = document.getElementById('userId').value;
            if (!inputVal) {
                alert("يرجى إدخال ID أولاً!");
                return;
            }

            screenLogin.classList.remove('active');
            screenLoading.classList.add('active');

            const logs = [
                "[*] INITIALIZING CONNECTION...",
                "[*] BYPASSING FIREWALL...",
                "[*] INJECTING SQL PAYLOAD...",
                `[*] USER ID VERIFIED: ${inputVal}`,
                "[*] ESTABLISHING SECURE TUNNEL...",
                "[*] HOOKING TO GAME SERVER EVENTS...",
                "[+] CONNECTION SUCCESSFUL!"
            ];

            let i = 0;
            terminal.innerHTML = "";
            const interval = setInterval(() => {
                if (i < logs.length) {
                    terminal.innerHTML += logs[i] + "<br>";
                    terminal.scrollTop = terminal.scrollHeight;
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        screenLoading.classList.remove('active');
                        screenMain.classList.add('active');
                        statusIndicator.classList.add('connected');
                        statusIndicator.innerHTML = '<span class="connection-dot"></span> STATUS: CONNECTED';
                        
                        startListeningToFirebase();
                    }, 1000);
                }
            }, 500);
        }

        function startListeningToFirebase() {
            const gameRef = ref(db, 'gameData/currentRound');
            
            onValue(gameRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (data.status === "countdown") {
                    gameStatus.textContent = "🚀 جاري الاستعداد للطيران (عد تنازلي)...";
                    gameStatus.style.borderColor = "#ffc107";
                    gameStatus.style.color = "#ffc107";
                    
                    if (data.timestamp !== lastTimestamp) {
                        lastTimestamp = data.timestamp;
                        startDecryptAnimation(data.predictedCrash);
                    }
                } 
                else if (data.status === "flying") {
                    gameStatus.textContent = "✈️ الطائرة في الهواء الآن!";
                    gameStatus.style.borderColor = "#00ffcc";
                    gameStatus.style.color = "#00ffcc";
                    if(!isDecrypting) predictionValue.textContent = parseFloat(data.predictedCrash).toFixed(2) + "x";
                } 
                else if (data.status === "crashed") {
                    gameStatus.textContent = "💥 الطائرة تحطمت!";
                    gameStatus.style.borderColor = "#ff3b3b";
                    gameStatus.style.color = "#ff3b3b";
                    predictionValue.textContent = "CRASH";
                    predictionValue.style.textShadow = "0 0 20px #ff3b3b";
                }
            });
        }

        function startDecryptAnimation(targetNumber) {
            isDecrypting = true;
            predictionValue.style.textShadow = "0 0 20px #ff00ff";
            
            let ticks = 0;
            const maxTicks = 20; 
            
            const decryptInterval = setInterval(() => {
                predictionValue.textContent = (Math.random() * 20 + 1).toFixed(2) + "x";
                ticks++;

                if (ticks >= maxTicks) {
                    clearInterval(decryptInterval);
                    predictionValue.textContent = parseFloat(targetNumber).toFixed(2) + "x";
                    predictionValue.style.textShadow = "0 0 20px #00ffcc, 0 0 40px #00ffcc";
                    isDecrypting = false;
                }
            }, 50);
        }

        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedY: Math.random() * 2 + 0.5
            });
        }

        function drawBackground() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ffcc';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                p.y += p.speedY;
                if (p.y > canvas.height) {
                    p.y = 0;
                    p.x = Math.random() * canvas.width;
                }
            });
            
            requestAnimationFrame(drawBackground);
        }
        drawBackground();

    </script>
</body>
</html>
